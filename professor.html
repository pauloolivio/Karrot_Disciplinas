<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Karoot - Professor</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="questoes.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 20px;
        }
        .app-container { width: 100%; max-width: 1400px; margin: 0 auto; }
        .header {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .avatar {
            width: 50px; height: 50px;
            background: linear-gradient(135deg, #ec489a 0%, #f43f5e 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        .user-details h2 { font-size: 18px; color: #1f2937; margin-bottom: 4px; }
        .user-details p { font-size: 12px; color: #6b7280; }
        .logout-btn {
            background: #f3f4f6;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            color: #6b7280;
            font-size: 14px;
            font-weight: 500;
            border: none;
            transition: all 0.3s;
        }
        .logout-btn:hover { background: #fee; color: #ef4444; transform: translateY(-2px); }
        .desconectar-btn {
            background: #ef4444;
            color: white;
        }
        .desconectar-btn:hover { background: #dc2626; color: white; }
        
        .filtro-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .disciplina-select {
            padding: 10px 20px;
            border-radius: 12px;
            border: 2px solid #e5e7eb;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }
        .selecionar-todos-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .questoes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .questao-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }
        .questao-card:hover { transform: translateY(-5px); }
        .questao-card.selected { 
            border: 3px solid #10b981; 
            background: #f0fdf4;
        }
        .questao-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .disciplina-badge {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: #f3f4f6;
            color: #6b7280;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 11px;
        }
        .questao-card h3 { font-size: 18px; color: #1f2937; margin-bottom: 12px; padding-right: 60px; }
        .alternativas-preview { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0; }
        .alt-preview { background: #f3f4f6; padding: 4px 10px; border-radius: 8px; font-size: 12px; }
        .resposta-correta { color: #10b981; font-size: 13px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #e5e7eb; }
        
        .controles-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .controles-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .timer-input {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f3f4f6;
            padding: 8px 15px;
            border-radius: 12px;
        }
        .timer-input input { width: 70px; padding: 6px; border-radius: 8px; border: 1px solid #ddd; text-align: center; }
        .btn-iniciar {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-iniciar:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .timer-bar-container {
            margin-top: 20px;
            background: #e5e7eb;
            border-radius: 10px;
            height: 8px;
            display: none;
        }
        .timer-bar {
            height: 100%;
            background: #10b981;
            width: 0%;
            border-radius: 10px;
            transition: width 0.3s linear;
        }
        .timer-text { text-align: center; margin-top: 10px; font-size: 14px; color: #6b7280; }
        
        .resultado-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .resultado-card.show { display: block; }
        .resultado-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
        .stat-box { background: #f3f4f6; padding: 15px; border-radius: 12px; text-align: center; }
        .stat-number { font-size: 32px; font-weight: bold; color: #667eea; }
        
        .alunos-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .alunos-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; max-height: 200px; overflow-y: auto; }
        .aluno-item {
            background: #f3f4f6;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            z-index: 1000;
            animation: fadeOut 2s ease;
        }
        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="user-info">
                <div class="avatar"><i class="fas fa-chalkboard-user"></i></div>
                <div class="user-details">
                    <h2 id="professorNome">Professor</h2>
                    <p id="professorEmail">---</p>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="logout-btn desconectar-btn" onclick="desconectarTodosAlunos()">
                    <i class="fas fa-user-slash"></i> Desconectar Todos
                </button>
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </div>
        </div>

        <div class="filtro-container">
            <select id="disciplinaSelect" class="disciplina-select" onchange="filtrarQuestoes()">
                <option value="todas">📚 Todas as Disciplinas</option>
            </select>
            <button class="selecionar-todos-btn" onclick="selecionarTodas()"><i class="fas fa-check-double"></i> Selecionar Todas</button>
        </div>

        <div class="questoes-grid" id="questoesGrid"></div>

        <div class="controles-card">
            <div class="controles-header">
                <h3><i class="fas fa-play-circle"></i> Iniciar Questão</h3>
                <div class="timer-input">
                    <i class="fas fa-hourglass-half"></i>
                    <input type="number" id="tempoQuestao" value="30" min="5" max="120">
                    <span>segundos</span>
                </div>
                <button class="btn-iniciar" id="btnIniciar" onclick="iniciarQuestao()" disabled>INICIAR</button>
            </div>
            <div id="timerBarContainer" class="timer-bar-container">
                <div class="timer-bar" id="timerBar"></div>
                <div class="timer-text" id="timerText"></div>
            </div>
        </div>

        <div class="resultado-card" id="resultadoCard">
            <h3><i class="fas fa-chart-line"></i> Resultado da Questão</h3>
            <div id="resultadoContent"></div>
            <button class="selecionar-todos-btn" onclick="fecharResultado()" style="margin-top: 20px;">Próxima Questão</button>
        </div>

        <div class="alunos-card">
            <h3><i class="fas fa-users"></i> Alunos Online <span id="alunosCount">(0)</span></h3>
            <div class="alunos-list" id="alunosList"></div>
        </div>
    </div>

    <script>
        let questoesSelecionadas = new Set();
        let questaoAtiva = null;
        let timerInterval = null;
        let perguntaIdAtual = null;

        function carregarDisciplinas() {
            const select = document.getElementById('disciplinaSelect');
            const disciplinas = window.getTodasDisciplinas();
            disciplinas.forEach(dis => {
                const option = document.createElement('option');
                option.value = dis;
                option.textContent = dis;
                select.appendChild(option);
            });
        }

        function renderizarQuestoes() {
            const disciplina = document.getElementById('disciplinaSelect').value;
            const questoes = window.getQuestoesPorDisciplina(disciplina);
            const grid = document.getElementById('questoesGrid');
            
            grid.innerHTML = questoes.map(q => `
                <div class="questao-card ${questoesSelecionadas.has(q.id) ? 'selected' : ''}" onclick="toggleQuestao(${q.id})">
                    <div class="questao-badge">Q${q.id}</div>
                    <div class="disciplina-badge">${q.disciplina}</div>
                    <h3>${q.texto}</h3>
                    <div class="alternativas-preview">
                        ${Object.entries(q.alternativas).map(([letra, texto]) => `<span class="alt-preview">${letra}) ${texto}</span>`).join('')}
                    </div>
                    <div class="resposta-correta">✓ Resposta: ${q.correta}) ${q.alternativas[q.correta]}</div>
                </div>
            `).join('');
            
            document.getElementById('btnIniciar').disabled = questoesSelecionadas.size === 0;
        }

        function filtrarQuestoes() {
            renderizarQuestoes();
        }

        function toggleQuestao(id) {
            if (questaoAtiva) {
                showToast("Aguardando questão atual terminar!");
                return;
            }
            
            if (questoesSelecionadas.has(id)) {
                questoesSelecionadas.delete(id);
            } else {
                questoesSelecionadas.add(id);
            }
            renderizarQuestoes();
        }

        function selecionarTodas() {
            if (questaoAtiva) return;
            const disciplina = document.getElementById('disciplinaSelect').value;
            const questoes = window.getQuestoesPorDisciplina(disciplina);
            questoes.forEach(q => questoesSelecionadas.add(q.id));
            renderizarQuestoes();
            showToast(`${questoesSelecionadas.size} questões selecionadas`);
        }

        async function limparDadosAntigos() {
            const agora = Date.now();
            const limiteInatividade = 5 * 60 * 1000;
            
            const alunosRef = window.db.ref('alunos');
            const snapshot = await alunosRef.once('value');
            const alunos = snapshot.val() || {};
            
            let count = 0;
            for (const [id, aluno] of Object.entries(alunos)) {
                if (aluno.online === true) {
                    const ultimaAtividade = aluno.ultimaAtividade || 0;
                    if (agora - ultimaAtividade > limiteInatividade) {
                        await alunosRef.child(id).update({ online: false, motivo: "inatividade", desconectadoEm: Date.now() });
                        count++;
                    }
                }
            }
            
            if (count > 0) {
                console.log(`🧹 Limpos ${count} alunos inativos`);
            }
        }

        async function desconectarTodosAlunos() {
            if (!confirm("⚠️ Tem certeza? Isso irá desconectar TODOS os alunos da sala.")) return;
            
            try {
                await window.db.ref('sessao/status').set({
                    ativa: false,
                    encerradaPor: "professor",
                    encerradaEm: Date.now()
                });
                
                const alunosRef = window.db.ref('alunos');
                const snapshot = await alunosRef.once('value');
                const alunos = snapshot.val() || {};
                
                let count = 0;
                for (const [id, aluno] of Object.entries(alunos)) {
                    if (aluno.online === true) {
                        await alunosRef.child(id).update({ 
                            online: false, 
                            desconectadoPor: "professor", 
                            desconectadoEm: Date.now(),
                            sessaoEncerrada: true
                        });
                        count++;
                    }
                }
                
                await window.db.ref('sessao/perguntaAtiva').set(null);
                
                showToast(`✅ ${count} aluno(s) desconectado(s)!`);
                
                setTimeout(() => {
                    window.db.ref('sessao/status').set({
                        ativa: true,
                        ultimaAtivacao: Date.now()
                    });
                }, 3000);
                
            } catch (error) {
                console.error("Erro ao desconectar alunos:", error);
                showToast("❌ Erro ao desconectar alunos");
            }
        }

        async function iniciarQuestao() {
            if (questoesSelecionadas.size === 0) {
                alert("Selecione uma questão!");
                return;
            }
            
            const primeiraId = Array.from(questoesSelecionadas)[0];
            const questao = window.getQuestaoById(primeiraId);
            
            if (!questao) return;
            
            questaoAtiva = questao;
            const tempo = parseInt(document.getElementById('tempoQuestao').value);
            const perguntaId = `${questao.id}_${Date.now()}`;
            perguntaIdAtual = perguntaId;
            
            console.log("📤 Enviando questão:", questao.texto);
            
            try {
                await window.db.ref('sessao/perguntaAtiva').set({
                    id: perguntaId,
                    questaoId: questao.id,
                    texto: questao.texto,
                    alternativas: questao.alternativas,
                    correta: questao.correta,
                    explicacao: questao.explicacao,
                    ativa: true,
                    inicioEm: Date.now(),
                    tempoLimite: tempo
                });
                
                await window.db.ref(`votos/${perguntaId}`).set({ A: 0, B: 0, C: 0, D: 0 });
                
                let tempoRestante = tempo;
                const timerContainer = document.getElementById('timerBarContainer');
                const timerBar = document.getElementById('timerBar');
                const timerText = document.getElementById('timerText');
                
                timerContainer.style.display = 'block';
                
                timerInterval = setInterval(async () => {
                    tempoRestante--;
                    const percent = (tempoRestante / tempo) * 100;
                    timerBar.style.width = `${percent}%`;
                    timerText.textContent = `⏱️ ${tempoRestante} segundos`;
                    
                    if (tempoRestante <= 0) {
                        clearInterval(timerInterval);
                        await finalizarQuestao(questao, perguntaId);
                        timerContainer.style.display = 'none';
                    }
                }, 1000);
                
                showToast(`✅ Questão iniciada: ${questao.texto}`);
                
            } catch (error) {
                console.error("Erro:", error);
                alert("Erro ao iniciar questão: " + error.message);
            }
        }
        
        async function finalizarQuestao(questao, perguntaId) {
            await window.db.ref('sessao/perguntaAtiva/ativa').set(false);
            
            const respostas = await window.db.ref(`respostas/${perguntaId}`).once('value');
            const respostasData = respostas.val() || {};
            const total = Object.keys(respostasData).length;
            
            const contagem = { A: 0, B: 0, C: 0, D: 0 };
            Object.values(respostasData).forEach(r => {
                if (r.letra) contagem[r.letra]++;
            });
            
            const acertos = contagem[questao.correta];
            const percentual = total > 0 ? ((acertos / total) * 100).toFixed(1) : 0;
            
            // ENVIO AUTOMÁTICO DE FEEDBACK - sem necessidade de digitar nada
            await window.db.ref(`feedback/${perguntaId}`).set({
                texto: "✅ " + questao.explicacao,
                status: "enviado",
                enviadoEm: Date.now(),
                questaoId: questao.id,
                questaoTexto: questao.texto,
                respostaCorreta: questao.correta,
                explicacao: questao.explicacao,
                alternativas: questao.alternativas,
                automatico: true
            });
            
            document.getElementById('resultadoContent').innerHTML = `
                <div class="resultado-stats">
                    <div class="stat-box"><div class="stat-number">${total}</div><div>Total Respostas</div></div>
                    <div class="stat-box"><div class="stat-number" style="color:#10b981">${acertos}</div><div>Acertos</div></div>
                    <div class="stat-box"><div class="stat-number" style="color:#f59e0b">${percentual}%</div><div>Aproveitamento</div></div>
                </div>
                <div style="margin-top: 20px;">
                    <h4>Distribuição das respostas:</h4>
                    ${Object.entries(contagem).map(([letra, qtd]) => `
                        <div style="display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #eee;">
                            <span><strong>Alternativa ${letra}</strong> - ${questao.alternativas[letra]}</span>
                            <span>${qtd} aluno${qtd !== 1 ? 's' : ''} (${total > 0 ? ((qtd/total)*100).toFixed(1) : 0}%)</span>
                            ${letra === questao.correta ? ' ✓' : ''}
                        </div>
                    `).join('')}
                </div>
                <div style="margin-top: 20px; padding: 15px; background: #e0f2fe; border-radius: 12px;">
                    <strong>Resposta Correta: ${questao.correta}) ${questao.alternativas[questao.correta]}</strong><br>
                    <small>${questao.explicacao}</small>
                </div>
                <div style="margin-top: 20px; padding: 15px; background: #d1fae5; border-radius: 12px;">
                    <i class="fas fa-check-circle" style="color: #10b981;"></i>
                    <strong>Feedback automático enviado aos alunos!</strong>
                </div>
            `;
            
            document.getElementById('resultadoCard').classList.add('show');
            
            questoesSelecionadas.delete(questao.id);
            questaoAtiva = null;
            renderizarQuestoes();
            
            setTimeout(async () => {
                const atual = await window.db.ref('sessao/perguntaAtiva').once('value');
                if (atual.val() && atual.val().ativa === false) {
                    await window.db.ref('sessao/perguntaAtiva').set(null);
                }
            }, 3000);
        }
        
        function fecharResultado() {
            document.getElementById('resultadoCard').classList.remove('show');
            perguntaIdAtual = null;
        }
        
        function listenToAlunos() {
            window.db.ref('alunos').on('value', (snapshot) => {
                const alunos = snapshot.val() || {};
                const online = Object.values(alunos).filter(a => a.online === true);
                document.getElementById('alunosCount').textContent = `(${online.length})`;
                document.getElementById('alunosList').innerHTML = online.map(a => 
                    `<div class="aluno-item"><i class="fas fa-circle" style="color:#10b981; font-size:10px;"></i> ${a.nome} (${a.ra})</div>`
                ).join('');
                if (online.length === 0) {
                    document.getElementById('alunosList').innerHTML = '<div style="color:#999;">Nenhum aluno online</div>';
                }
            });
        }
        
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        function loadProfessorData() {
            const email = sessionStorage.getItem('userEmail');
            if (email) {
                document.getElementById('professorEmail').textContent = email;
                document.getElementById('professorNome').innerHTML = `<i class="fas fa-user"></i> ${email.split('@')[0]}`;
            }
        }
        
        async function logout() {
            if (timerInterval) clearInterval(timerInterval);
            await window.db.ref('sessao/perguntaAtiva').set(null);
            await window.auth.signOut();
            sessionStorage.clear();
            window.location.href = "index.html";
        }
        
        // Expor funções globais
        window.toggleQuestao = toggleQuestao;
        window.filtrarQuestoes = filtrarQuestoes;
        window.selecionarTodas = selecionarTodas;
        window.iniciarQuestao = iniciarQuestao;
        window.fecharResultado = fecharResultado;
        window.desconectarTodosAlunos = desconectarTodosAlunos;
        window.logout = logout;
        
        // Inicialização
        window.auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            loadProfessorData();
            await limparDadosAntigos();
            carregarDisciplinas();
            renderizarQuestoes();
            listenToAlunos();
        });
    </script>
</body>
</html>
