<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Karoot - Professor</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="questoes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 20px;
        }
        .app-container { width: 100%; max-width: 1400px; margin: 0 auto; }
        
        /* Header */
        .header {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .avatar {
            width: 50px; height: 50px;
            background: linear-gradient(135deg, #ec489a 0%, #f43f5e 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        .user-details h2 { font-size: 18px; color: #1f2937; margin-bottom: 4px; }
        .user-details p { font-size: 12px; color: #6b7280; }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-header {
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            border: none;
            transition: all 0.3s;
            background: #f3f4f6;
            color: #6b7280;
        }
        .btn-header:hover { transform: translateY(-2px); }
        .btn-export { background: #10b981; color: white; }
        .btn-export:hover { background: #059669; }
        .btn-clean { background: #f59e0b; color: white; }
        .btn-clean:hover { background: #d97706; }
        .btn-disconnect { background: #ef4444; color: white; }
        .btn-disconnect:hover { background: #dc2626; }
        .btn-logout { background: #f3f4f6; color: #6b7280; }
        .btn-logout:hover { background: #fee; color: #ef4444; }
        .ranking-automatico-badge {
            background: #8b5cf6;
            color: white;
            padding: 8px 15px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
        }
        .ranking-automatico-badge i {
            margin-right: 5px;
        }
        
        /* Filtros */
        .filtro-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .disciplina-select {
            padding: 10px 20px;
            border-radius: 12px;
            border: 2px solid #e5e7eb;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }
        .selecionar-todos-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .selecionar-todos-btn:hover { transform: translateY(-2px); background: #5a67d8; }
        
        /* Questões */
        .questoes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .questao-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }
        .questao-card:hover { transform: translateY(-5px); }
        .questao-card.selected { 
            border: 3px solid #10b981; 
            background: #f0fdf4;
        }
        .questao-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .disciplina-badge {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: #f3f4f6;
            color: #6b7280;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 11px;
        }
        .questao-card h3 { font-size: 18px; color: #1f2937; margin-bottom: 12px; padding-right: 60px; }
        .alternativas-preview { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0; }
        .alt-preview { background: #f3f4f6; padding: 4px 10px; border-radius: 8px; font-size: 12px; }
        .resposta-correta { color: #10b981; font-size: 13px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #e5e7eb; }
        
        /* Controles */
        .controles-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .controles-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .timer-input {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f3f4f6;
            padding: 8px 15px;
            border-radius: 12px;
        }
        .timer-input input { width: 70px; padding: 6px; border-radius: 8px; border: 1px solid #ddd; text-align: center; }
        .btn-iniciar {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-iniciar:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .timer-bar-container {
            margin-top: 20px;
            background: #e5e7eb;
            border-radius: 10px;
            height: 8px;
            display: none;
        }
        .timer-bar {
            height: 100%;
            background: #10b981;
            width: 0%;
            border-radius: 10px;
            transition: width 0.3s linear;
        }
        .timer-text { text-align: center; margin-top: 10px; font-size: 14px; color: #6b7280; }
        
        /* Resultado da Questão */
        .resultado-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .resultado-card.show { display: block; }
        .resultado-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
        .stat-box { background: #f3f4f6; padding: 15px; border-radius: 12px; text-align: center; }
        .stat-number { font-size: 32px; font-weight: bold; color: #667eea; }
        
        /* Alunos Online */
        .alunos-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .alunos-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; max-height: 200px; overflow-y: auto; }
        .aluno-item {
            background: #f3f4f6;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
        }
        
        /* Seção de Análise e Exportação */
        .analise-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .analise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e5e7eb;
        }
        .analise-header h3 {
            font-size: 20px;
            color: #1f2937;
        }
        .btn-analise {
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-analise:hover { transform: translateY(-2px); background: #7c3aed; }
        
        .graficos-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 25px;
        }
        .grafico-box {
            background: #f9fafb;
            border-radius: 16px;
            padding: 20px;
        }
        .grafico-box h4 {
            margin-bottom: 15px;
            color: #374151;
            font-size: 16px;
        }
        canvas { max-height: 300px; width: 100%; }
        
        .tabela-alunos {
            margin-top: 25px;
            overflow-x: auto;
        }
        .tabela-alunos table {
            width: 100%;
            border-collapse: collapse;
        }
        .tabela-alunos th, .tabela-alunos td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        .tabela-alunos th {
            background: #f3f4f6;
            font-weight: 600;
            color: #374151;
        }
        .tabela-alunos tr:hover {
            background: #f9fafb;
        }
        .acerto { color: #10b981; font-weight: 600; }
        .erro { color: #ef4444; font-weight: 600; }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            z-index: 1000;
            animation: fadeOut 3s ease;
        }
        .toast.error { background: #ef4444; }
        .toast.warning { background: #f59e0b; }
        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .badge-sucesso {
            background: #d1fae5;
            color: #065f46;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-erro {
            background: #fee2e2;
            color: #991b1b;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Modal de Ranking Preview */
        .feedback-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeInModal 0.3s ease;
        }
        @keyframes fadeInModal {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .feedback-modal-content {
            background: white;
            max-width: 500px;
            width: 90%;
            border-radius: 24px;
            padding: 25px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .btn-fechar-feedback {
            width: 100%;
            padding: 12px;
            background: #6b7280;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            margin-top: 15px;
        }
        .btn-fechar-feedback:hover { background: #4b5563; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="user-info">
                <div class="avatar"><i class="fas fa-chalkboard-user"></i></div>
                <div class="user-details">
                    <h2 id="professorNome">Professor</h2>
                    <p id="professorEmail">---</p>
                </div>
            </div>
            <div class="btn-group">
                <div class="ranking-automatico-badge">
                    <i class="fas fa-sync-alt"></i> Ranking Automático
                </div>
                <button class="btn-header btn-export" onclick="exportarDadosCompletos()">
                    <i class="fas fa-download"></i> Exportar JSON
                </button>
                <button class="btn-header btn-clean" onclick="limparDadosRapido()">
                    <i class="fas fa-broom"></i> Limpar Dados
                </button>
                <button class="btn-header btn-disconnect" onclick="confirmarDesconectarTodos()">
                    <i class="fas fa-user-slash"></i> Desconectar Todos
                </button>
                <button class="btn-header btn-logout" onclick="confirmarLogout()">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </div>
        </div>

        <div class="filtro-container">
            <select id="disciplinaSelect" class="disciplina-select" onchange="filtrarQuestoes()">
                <option value="todas">📚 Todas as Disciplinas</option>
            </select>
            <button class="selecionar-todos-btn" onclick="selecionarTodas()"><i class="fas fa-check-double"></i> Selecionar Todas</button>
        </div>

        <div class="questoes-grid" id="questoesGrid"></div>

        <div class="controles-card">
            <div class="controles-header">
                <h3><i class="fas fa-play-circle"></i> Iniciar Questão</h3>
                <div class="timer-input">
                    <i class="fas fa-hourglass-half"></i>
                    <input type="number" id="tempoQuestao" value="30" min="5" max="120">
                    <span>segundos</span>
                </div>
                <button class="btn-iniciar" id="btnIniciar" onclick="iniciarQuestao()" disabled>INICIAR</button>
            </div>
            <div id="timerBarContainer" class="timer-bar-container">
                <div class="timer-bar" id="timerBar"></div>
                <div class="timer-text" id="timerText"></div>
            </div>
        </div>

        <div class="resultado-card" id="resultadoCard">
            <h3><i class="fas fa-chart-line"></i> Resultado da Questão</h3>
            <div id="resultadoContent"></div>
            <button class="selecionar-todos-btn" onclick="fecharResultado()" style="margin-top: 20px;">Próxima Questão</button>
        </div>

        <div class="alunos-card">
            <h3><i class="fas fa-users"></i> Alunos Online <span id="alunosCount">(0)</span></h3>
            <div class="alunos-list" id="alunosList"></div>
        </div>

        <!-- Seção de Análise e Exportação -->
        <div class="analise-card" id="analiseCard">
            <div class="analise-header">
                <h3><i class="fas fa-chart-pie"></i> Análise de Desempenho dos Alunos</h3>
                <div>
                    <button class="btn-analise" onclick="analisarDesempenho()" style="margin-right: 10px;">
                        <i class="fas fa-chart-line"></i> Analisar Agora
                    </button>
                    <button class="btn-analise" onclick="exportarDadosCompletos()" style="background: #10b981;">
                        <i class="fas fa-database"></i> Exportar Dados Completos
                    </button>
                </div>
            </div>
            
            <div class="graficos-container" id="graficosContainer" style="display: none;">
                <div class="grafico-box">
                    <h4><i class="fas fa-chart-bar"></i> Desempenho por Aluno</h4>
                    <canvas id="desempenhoAlunosChart"></canvas>
                </div>
                <div class="grafico-box">
                    <h4><i class="fas fa-chart-pie"></i> Acertos vs Erros (Total)</h4>
                    <canvas id="acertosErrosChart"></canvas>
                </div>
                <div class="grafico-box">
                    <h4><i class="fas fa-chart-line"></i> Acertos por Disciplina</h4>
                    <canvas id="acertosDisciplinaChart"></canvas>
                </div>
            </div>
            
            <div class="tabela-alunos" id="tabelaAlunos" style="display: none;">
                <h4><i class="fas fa-table"></i> Detalhamento por Aluno</h4>
                <div id="tabelaContent"></div>
            </div>
        </div>
    </div>

    <script>
        let questoesSelecionadas = new Set();
        let questaoAtiva = null;
        let timerInterval = null;
        let perguntaIdAtual = null;
        
        // Gráficos
        let desempenhoAlunosChart = null;
        let acertosErrosChart = null;
        let acertosDisciplinaChart = null;

        // ============= FUNÇÕES DE INICIALIZAÇÃO =============
        
        function carregarDisciplinas() {
            const select = document.getElementById('disciplinaSelect');
            const disciplinas = window.getTodasDisciplinas();
            disciplinas.forEach(dis => {
                const option = document.createElement('option');
                option.value = dis;
                option.textContent = dis;
                select.appendChild(option);
            });
        }

        function renderizarQuestoes() {
            const disciplina = document.getElementById('disciplinaSelect').value;
            const questoes = window.getQuestoesPorDisciplina(disciplina);
            const grid = document.getElementById('questoesGrid');
            
            grid.innerHTML = questoes.map(q => `
                <div class="questao-card ${questoesSelecionadas.has(q.id) ? 'selected' : ''}" onclick="toggleQuestao(${q.id})">
                    <div class="questao-badge">Q${q.id}</div>
                    <div class="disciplina-badge">${q.disciplina}</div>
                    <h3>${q.texto}</h3>
                    <div class="alternativas-preview">
                        ${Object.entries(q.alternativas).map(([letra, texto]) => `<span class="alt-preview">${letra}) ${texto.substring(0, 30)}${texto.length > 30 ? '...' : ''}</span>`).join('')}
                    </div>
                    <div class="resposta-correta">✓ Resposta: ${q.correta}) ${q.alternativas[q.correta].substring(0, 40)}${q.alternativas[q.correta].length > 40 ? '...' : ''}</div>
                </div>
            `).join('');
            
            document.getElementById('btnIniciar').disabled = questoesSelecionadas.size === 0;
        }

        function filtrarQuestoes() {
            renderizarQuestoes();
        }

        function toggleQuestao(id) {
            if (questaoAtiva) {
                showToast("Aguardando questão atual terminar!", "warning");
                return;
            }
            
            if (questoesSelecionadas.has(id)) {
                questoesSelecionadas.delete(id);
            } else {
                questoesSelecionadas.add(id);
            }
            renderizarQuestoes();
        }

        function selecionarTodas() {
            if (questaoAtiva) return;
            const disciplina = document.getElementById('disciplinaSelect').value;
            const questoes = window.getQuestoesPorDisciplina(disciplina);
            questoes.forEach(q => questoesSelecionadas.add(q.id));
            renderizarQuestoes();
            showToast(`${questoesSelecionadas.size} questões selecionadas`);
        }

        async function limparDadosAntigos() {
            const agora = Date.now();
            const limiteInatividade = 5 * 60 * 1000;
            
            const alunosRef = window.db.ref('alunos');
            const snapshot = await alunosRef.once('value');
            const alunos = snapshot.val() || {};
            
            let count = 0;
            for (const [id, aluno] of Object.entries(alunos)) {
                if (aluno.online === true) {
                    const ultimaAtividade = aluno.ultimaAtividade || 0;
                    if (agora - ultimaAtividade > limiteInatividade) {
                        await alunosRef.child(id).remove();
                        count++;
                    }
                }
            }
            
            if (count > 0) {
                console.log(`🧹 Removidos ${count} alunos inativos`);
            }
        }

        function showLoading() {
            const overlay = document.createElement('div');
            overlay.id = 'loadingOverlay';
            overlay.className = 'loading-overlay';
            overlay.innerHTML = '<div class="spinner"></div>';
            document.body.appendChild(overlay);
        }

        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) overlay.remove();
        }

        // ============= FUNÇÃO DE RANKING AUTOMÁTICO =============
        
        async function atualizarRankingAutomatico() {
            try {
                console.log("🔄 Atualizando ranking automático...");
                
                // Coletar dados de desempenho
                const questoes = {};
                const todasDisciplinas = window.getTodasDisciplinas();
                for (const disciplina of todasDisciplinas) {
                    const questoesDisciplina = window.getQuestoesPorDisciplina(disciplina);
                    questoesDisciplina.forEach(q => {
                        questoes[q.id] = {
                            ...q,
                            disciplina: disciplina
                        };
                    });
                }
                
                const respostasRef = window.db.ref('respostas');
                const respostasSnap = await respostasRef.once('value');
                const respostas = respostasSnap.val() || {};
                
                const alunosRef = window.db.ref('alunos');
                const alunosSnap = await alunosRef.once('value');
                const alunos = alunosSnap.val() || {};
                
                // Calcular desempenho de cada aluno
                const desempenhoAlunos = [];
                
                for (const [alunoId, alunoData] of Object.entries(alunos)) {
                    if (!alunoData.online) continue;
                    
                    let acertos = 0;
                    let total = 0;
                    let somaPontuacao = 0;
                    let questoesDetalhes = [];
                    
                    for (const [perguntaId, respostasPergunta] of Object.entries(respostas)) {
                        if (respostasPergunta[alunoId]) {
                            const resposta = respostasPergunta[alunoId];
                            const questaoId = perguntaId.split('_')[0];
                            const questao = questoes[parseInt(questaoId)];
                            
                            if (questao) {
                                const isCorreta = resposta.letra === questao.correta;
                                if (isCorreta) {
                                    acertos++;
                                    somaPontuacao += resposta.pontuacao || 0;
                                }
                                total++;
                                
                                questoesDetalhes.push({
                                    questaoId: questaoId,
                                    questaoTexto: questao.texto,
                                    isCorreta: isCorreta,
                                    pontuacao: resposta.pontuacao || 0,
                                    tempoRestante: resposta.tempoRestante || 0
                                });
                            }
                        }
                    }
                    
                    // Pontuação final: acertos * 1000 + soma das pontuações (tempo)
                    const pontuacaoFinal = (acertos * 1000) + somaPontuacao;
                    
                    desempenhoAlunos.push({
                        id: alunoId,
                        nome: alunoData.nome,
                        ra: alunoData.ra,
                        acertos: acertos,
                        total: total,
                        percentual: total > 0 ? ((acertos / total) * 100).toFixed(1) : 0,
                        pontuacaoFinal: pontuacaoFinal,
                        somaPontuacaoTempo: somaPontuacao,
                        questoesDetalhes: questoesDetalhes
                    });
                }
                
                // Ordenar por pontuação final (decrescente)
                desempenhoAlunos.sort((a, b) => b.pontuacaoFinal - a.pontuacaoFinal);
                
                // Adicionar posição no ranking
                desempenhoAlunos.forEach((aluno, idx) => {
                    aluno.posicao = idx + 1;
                });
                
                // Salvar ranking no Firebase (sempre liberado automaticamente)
                await window.db.ref('ranking/atual').set({
                    data: Date.now(),
                    liberado: true,
                    alunos: desempenhoAlunos,
                    totalAlunos: desempenhoAlunos.length,
                    melhorAluno: desempenhoAlunos[0] || null,
                    atualizadoAutomaticamente: true
                });
                
                if (desempenhoAlunos.length > 0) {
                    console.log(`✅ Ranking atualizado automaticamente! ${desempenhoAlunos.length} alunos no ranking.`);
                }
                
            } catch (error) {
                console.error("Erro ao atualizar ranking automático:", error);
            }
        }

        // ============= FUNÇÕES DE QUESTÕES =============
        
        async function iniciarQuestao() {
            if (questoesSelecionadas.size === 0) {
                showToast("Selecione uma questão primeiro!", "error");
                return;
            }
            
            const primeiraId = Array.from(questoesSelecionadas)[0];
            const questao = window.getQuestaoById(primeiraId);
            
            if (!questao) return;
            
            questaoAtiva = questao;
            const tempo = parseInt(document.getElementById('tempoQuestao').value);
            const perguntaId = `${questao.id}_${Date.now()}`;
            perguntaIdAtual = perguntaId;
            
            console.log("📤 Enviando questão:", questao.texto);
            
            try {
                await window.db.ref('sessao/perguntaAtiva').set({
                    id: perguntaId,
                    questaoId: questao.id,
                    texto: questao.texto,
                    alternativas: questao.alternativas,
                    correta: questao.correta,
                    explicacao: questao.explicacao,
                    disciplina: questao.disciplina,
                    ativa: true,
                    inicioEm: Date.now(),
                    tempoLimite: tempo
                });
                
                await window.db.ref(`votos/${perguntaId}`).set({ A: 0, B: 0, C: 0, D: 0 });
                
                let tempoRestante = tempo;
                const timerContainer = document.getElementById('timerBarContainer');
                const timerBar = document.getElementById('timerBar');
                const timerText = document.getElementById('timerText');
                
                timerContainer.style.display = 'block';
                
                timerInterval = setInterval(async () => {
                    tempoRestante--;
                    const percent = (tempoRestante / tempo) * 100;
                    timerBar.style.width = `${percent}%`;
                    timerText.textContent = `⏱️ ${tempoRestante} segundos`;
                    
                    if (tempoRestante <= 0) {
                        clearInterval(timerInterval);
                        await finalizarQuestao(questao, perguntaId);
                        timerContainer.style.display = 'none';
                    }
                }, 1000);
                
                showToast(`✅ Questão iniciada: ${questao.texto.substring(0, 50)}...`);
                
            } catch (error) {
                console.error("Erro:", error);
                showToast("Erro ao iniciar questão: " + error.message, "error");
            }
        }
        
        async function finalizarQuestao(questao, perguntaId) {
            await window.db.ref('sessao/perguntaAtiva/ativa').set(false);
            
            const respostas = await window.db.ref(`respostas/${perguntaId}`).once('value');
            const respostasData = respostas.val() || {};
            const total = Object.keys(respostasData).length;
            
            const contagem = { A: 0, B: 0, C: 0, D: 0 };
            Object.values(respostasData).forEach(r => {
                if (r.letra) contagem[r.letra]++;
            });
            
            const acertos = contagem[questao.correta];
            const percentual = total > 0 ? ((acertos / total) * 100).toFixed(1) : 0;
            
            await window.db.ref(`feedback/${perguntaId}`).set({
                texto: "✅ " + questao.explicacao,
                status: "enviado",
                enviadoEm: Date.now(),
                questaoId: questao.id,
                questaoTexto: questao.texto,
                respostaCorreta: questao.correta,
                explicacao: questao.explicacao,
                alternativas: questao.alternativas,
                automatico: true
            });
            
            document.getElementById('resultadoContent').innerHTML = `
                <div class="resultado-stats">
                    <div class="stat-box"><div class="stat-number">${total}</div><div>Total Respostas</div></div>
                    <div class="stat-box"><div class="stat-number" style="color:#10b981">${acertos}</div><div>Acertos</div></div>
                    <div class="stat-box"><div class="stat-number" style="color:#f59e0b">${percentual}%</div><div>Aproveitamento</div></div>
                </div>
                <div style="margin-top: 20px;">
                    <h4>Distribuição das respostas:</h4>
                    ${Object.entries(contagem).map(([letra, qtd]) => `
                        <div style="display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #eee;">
                            <span><strong>Alternativa ${letra}</strong> - ${questao.alternativas[letra].substring(0, 50)}${questao.alternativas[letra].length > 50 ? '...' : ''}</span>
                            <span>${qtd} aluno${qtd !== 1 ? 's' : ''} (${total > 0 ? ((qtd/total)*100).toFixed(1) : 0}%)</span>
                            ${letra === questao.correta ? ' ✓' : ''}
                        </div>
                    `).join('')}
                </div>
                <div style="margin-top: 20px; padding: 15px; background: #e0f2fe; border-radius: 12px;">
                    <strong>Resposta Correta: ${questao.correta}) ${questao.alternativas[questao.correta]}</strong><br>
                    <small>${questao.explicacao}</small>
                </div>
            `;
            
            document.getElementById('resultadoCard').classList.add('show');
            
            questoesSelecionadas.delete(questao.id);
            questaoAtiva = null;
            renderizarQuestoes();
            
            // Atualizar ranking após finalizar a questão
            setTimeout(() => {
                atualizarRankingAutomatico();
            }, 2000);
            
            setTimeout(async () => {
                const atual = await window.db.ref('sessao/perguntaAtiva').once('value');
                if (atual.val() && atual.val().ativa === false) {
                    await window.db.ref('sessao/perguntaAtiva').set(null);
                }
            }, 3000);
        }

        // ============= FUNÇÕES DE ANÁLISE E EXPORTAÇÃO =============
        
        async function coletarDadosCompletos() {
            showLoading();
            
            try {
                const questoes = {};
                const todasDisciplinas = window.getTodasDisciplinas();
                for (const disciplina of todasDisciplinas) {
                    const questoesDisciplina = window.getQuestoesPorDisciplina(disciplina);
                    questoesDisciplina.forEach(q => {
                        questoes[q.id] = {
                            ...q,
                            disciplina: disciplina
                        };
                    });
                }
                
                const respostasRef = window.db.ref('respostas');
                const respostasSnap = await respostasRef.once('value');
                const respostas = respostasSnap.val() || {};
                
                const alunosRef = window.db.ref('alunos');
                const alunosSnap = await alunosRef.once('value');
                const alunos = alunosSnap.val() || {};
                
                const desempenhoAlunos = [];
                const acertosPorAluno = {};
                const totalRespondidoPorAluno = {};
                
                for (const [alunoId, alunoData] of Object.entries(alunos)) {
                    const respostasAluno = [];
                    let acertos = 0;
                    let total = 0;
                    
                    for (const [perguntaId, respostasPergunta] of Object.entries(respostas)) {
                        if (respostasPergunta[alunoId]) {
                            const resposta = respostasPergunta[alunoId];
                            const questaoId = perguntaId.split('_')[0];
                            const questao = questoes[parseInt(questaoId)];
                            
                            if (questao) {
                                const isCorreta = resposta.letra === questao.correta;
                                if (isCorreta) acertos++;
                                total++;
                                
                                respostasAluno.push({
                                    perguntaId: perguntaId,
                                    questaoId: questaoId,
                                    questaoTexto: questao.texto,
                                    disciplina: questao.disciplina,
                                    resposta: resposta.letra,
                                    correta: questao.correta,
                                    isCorreta: isCorreta,
                                    timestamp: resposta.timestamp
                                });
                            }
                        }
                    }
                    
                    acertosPorAluno[alunoId] = acertos;
                    totalRespondidoPorAluno[alunoId] = total;
                    
                    desempenhoAlunos.push({
                        id: alunoId,
                        nome: alunoData.nome,
                        ra: alunoData.ra,
                        acertos: acertos,
                        total: total,
                        percentual: total > 0 ? ((acertos / total) * 100).toFixed(1) : 0,
                        respostas: respostasAluno
                    });
                }
                
                const questoesRespondidas = [];
                for (const [perguntaId, respostasPergunta] of Object.entries(respostas)) {
                    const questaoId = perguntaId.split('_')[0];
                    const questao = questoes[parseInt(questaoId)];
                    if (questao) {
                        const totalRespostas = Object.keys(respostasPergunta).length;
                        const acertosQuestao = Object.values(respostasPergunta).filter(r => r.letra === questao.correta).length;
                        
                        questoesRespondidas.push({
                            perguntaId: perguntaId,
                            questaoId: questaoId,
                            questaoTexto: questao.texto,
                            disciplina: questao.disciplina,
                            totalRespostas: totalRespostas,
                            acertos: acertosQuestao,
                            percentualAcertos: totalRespostas > 0 ? ((acertosQuestao / totalRespostas) * 100).toFixed(1) : 0,
                            respostas: respostasPergunta
                        });
                    }
                }
                
                let totalRespostasGeral = 0;
                let totalAcertosGeral = 0;
                for (const aluno of desempenhoAlunos) {
                    totalRespostasGeral += aluno.total;
                    totalAcertosGeral += aluno.acertos;
                }
                
                const dadosCompletos = {
                    dataExportacao: new Date().toISOString(),
                    estatisticasGerais: {
                        totalAlunos: Object.keys(alunos).length,
                        totalQuestoesRespondidas: questoesRespondidas.length,
                        totalRespostas: totalRespostasGeral,
                        totalAcertos: totalAcertosGeral,
                        mediaAcertosGeral: totalRespostasGeral > 0 ? ((totalAcertosGeral / totalRespostasGeral) * 100).toFixed(1) : 0
                    },
                    desempenhoPorAluno: desempenhoAlunos,
                    desempenhoPorQuestao: questoesRespondidas,
                    questoesCadastradas: Object.values(questoes),
                    alunosCadastrados: Object.values(alunos).map(a => ({
                        nome: a.nome,
                        ra: a.ra,
                        online: a.online,
                        entrouEm: a.entrouEm
                    }))
                };
                
                return dadosCompletos;
                
            } catch (error) {
                console.error("Erro ao coletar dados:", error);
                showToast("Erro ao coletar dados: " + error.message, "error");
                return null;
            } finally {
                hideLoading();
            }
        }
        
        async function exportarDadosCompletos() {
            const dados = await coletarDadosCompletos();
            if (!dados) return;
            
            const jsonStr = JSON.stringify(dados, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = `karoot_dados_${new Date().toISOString().slice(0,19)}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            showToast(`📊 Dados exportados com sucesso! ${dados.estatisticasGerais.totalAlunos} alunos, ${dados.estatisticasGerais.totalQuestoesRespondidas} questões respondidas.`);
        }

                                }
                            }
                        }
                    }
                }
            });
            
            const totalAcertos = dados.estatisticasGerais.totalAcertos;
            const totalErros = dados.estatisticasGerais.totalRespostas - totalAcertos;
            
            if (acertosErrosChart) acertosErrosChart.destroy();

                        }
                    }
                }
            });
            
            const acertosPorDisciplina = {};
            const totalPorDisciplina = {};
            
            for (const aluno of dados.desempenhoPorAluno) {
                for (const resposta of aluno.respostas) {
                    const disciplina = resposta.disciplina;
                    if (!acertosPorDisciplina[disciplina]) {
                        acertosPorDisciplina[disciplina] = 0;

                    }
                    totalPorDisciplina[disciplina]++;
                    if (resposta.isCorreta) acertosPorDisciplina[disciplina]++;
                }
            }
            
            const disciplinas = Object.keys(acertosPorDisciplina);
            const percentuaisDisciplina = disciplinas.map(d => 
                totalPorDisciplina[d] > 0 ? ((acertosPorDisciplina[d] / totalPorDisciplina[d]) * 100).toFixed(1) : 0
            );
            
            if (acertosDisciplinaChart) acertosDisciplinaChart.destroy();

                        data: percentuaisDisciplina,
                        backgroundColor: '#f59e0b',
                        borderRadius: 8

                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: { y: { beginAtZero: true, max: 100, title: { display: true, text: 'Acertos (%)' } } }
                }
            });
            
            const tabelaHtml = `
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>RA</th>
                            <th>Questões Respondidas</th>
                            <th>Acertos</th>
                            <th>Percentual</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                                <td>${aluno.ra}</td>
                                <td>${aluno.total}</td>
                                <td>${aluno.acertos}</td>
                                <td class="${parseFloat(aluno.percentual) >= 70 ? 'acerto' : 'erro'}">${aluno.percentual}%</td>
                                <td>${aluno.total > 0 ? 
                                    (parseFloat(aluno.percentual) >= 70 ? 
                                        '<span class="badge-sucesso">✅ Bom desempenho</span>' : 
                                        '<span class="badge-erro">⚠️ Precisa melhorar</span>') : 
                                    '<span class="badge-erro">❌ Sem respostas</span>'}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            document.getElementById('tabelaContent').innerHTML = tabelaHtml;
            
            showToast(`📊 Análise concluída! ${dados.desempenhoPorAluno.filter(a => a.total > 0).length} alunos ativos.`);

        function showToast(msg, type = "success") {
            const toast = document.createElement('div');
            toast.className = `toast ${type === "error" ? "error" : (type === "warning" ? "warning" : "")}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function loadProfessorData() {
            const email = sessionStorage.getItem('userEmail');
            if (email) {
                document.getElementById('professorEmail').textContent = email;
                document.getElementById('professorNome').innerHTML = `<i class="fas fa-user"></i> ${email.split('@')[0]}`;
            }
        }
        
        // Expor funções globais
        window.toggleQuestao = toggleQuestao;
        window.filtrarQuestoes = filtrarQuestoes;
        window.selecionarTodas = selecionarTodas;
        window.iniciarQuestao = iniciarQuestao;
        window.fecharResultado = fecharResultado;
        window.desconectarTodosAlunos = desconectarTodosAlunos;
        window.confirmarDesconectarTodos = confirmarDesconectarTodos;
        window.logout = logout;
        window.confirmarLogout = confirmarLogout;
        window.exportarDadosCompletos = exportarDadosCompletos;
        window.analisarDesempenho = analisarDesempenho;
        window.limparDadosRapido = limparDadosRapido;
        
        // Inicialização
        window.auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            loadProfessorData();
            await limparDadosAntigos();
            carregarDisciplinas();
            renderizarQuestoes();
            listenToAlunos();
            
            // Iniciar listeners para ranking automático
            listenToRespostasChanges();
            
            // Atualizar ranking inicial
            setTimeout(() => {
                atualizarRankingAutomatico();
            }, 2000);
        });
    </script>
</body>
</html>
